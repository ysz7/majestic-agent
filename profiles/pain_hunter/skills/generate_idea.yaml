name: generate_idea
description: Generate a structured business idea report from a validated pain cluster
triggers:
  - generate idea
  - create business idea
  - idea from pain
  - generate opportunity report
steps:
  - Load top cluster from data/clusters.db (highest validation score)
  - Generate full idea report with sections: Problem, Idea, Target Customer, Solution Type, How It Works, Monetization, Existing Alternatives, Unfair Advantage, Risks, Sources
  - For clusters with validation 8+, generate 2-3 angles (minimal MVP / full product / adjacent opportunity)
  - Save idea as markdown to output/ideas/[niche]/[idea-name].md
  - Save idea record to data/ideas.db
  - Every claim must cite at least one source URL
