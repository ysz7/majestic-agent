name: scan_producthunt
description: Scan ProductHunt comments for unmet needs and feature gaps
triggers:
  - scan producthunt
  - product hunt pain points
  - producthunt complaints
  - find producthunt feature requests
steps:
  - Run web_search with query: site:producthunt.com "[niche]" "would love" OR "wish it also"
  - Run web_search with query: site:producthunt.com "[niche]" "missing" OR "feature" OR "if only"
  - Run web_search with query: site:alternativeto.net "[niche]" to find what alternatives people seek
  - Fetch top 5 results using web_fetch
  - Focus on upvoted comments — validation signal
  - Save raw content to output/raw/[niche]/[date]/producthunt.txt
  - Call extract_pain skill on collected content
