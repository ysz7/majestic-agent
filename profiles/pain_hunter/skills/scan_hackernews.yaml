name: scan_hackernews
description: Scan Hacker News for pain points using Algolia open API and Google search
triggers:
  - scan hacker news
  - scan hn
  - hacker news pain points
  - search hn for problems
steps:
  - Fetch https://hn.algolia.com/api/v1/search?query=[niche]+problem&tags=comment&hitsPerPage=20 using web_fetch
  - Fetch https://hn.algolia.com/api/v1/search?query=Ask+HN+[niche]&tags=ask_hn&hitsPerPage=10 using web_fetch
  - Run web_search with query: site:news.ycombinator.com "Ask HN" "[niche]" problem OR frustration
  - Extract comments with most points — these are highest-signal pain signals
  - Save raw content to output/raw/[niche]/[date]/hackernews.txt
  - Call extract_pain skill on collected content
