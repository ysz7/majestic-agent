name: monitor_niche
description: Continuously monitor a niche for new pain signals and opportunities
triggers:
  - monitor niche
  - watch niche
  - continuous monitoring
  - track pain signals
steps:
  - Load top 3 priority niches from data/niches.db
  - Run scan_reddit + scan_hackernews on each niche (lightweight, top results only)
  - Run extract_pain on new content
  - Compare new pains to existing clusters — update counts
  - Check if any cluster crossed validation threshold 8+
  - If yes, trigger validate_demand and generate_idea automatically
  - Generate daily digest and save to output/digest/[date].md
  - Update niches.db with last_researched timestamp
