name: scan_github
description: Scan GitHub issues for feature requests and missing capabilities in niche tools
triggers:
  - scan github
  - github issues
  - github feature requests
  - find github pain points
steps:
  - Run web_search with query: site:github.com "[niche]" issues "feature request" OR "wish" OR "missing"
  - Run web_search with query: site:github.com "[niche tool]" "enhancement" label high thumbs up
  - Fetch top 5 result URLs using web_fetch
  - Look for issues with high reaction counts — widely felt pain
  - Save raw content to output/raw/[niche]/[date]/github.txt
  - Call extract_pain skill on collected content
