# MCP server registry (Phase K.3 — real stdio JSON-RPC client).
#
# Only servers with `enabled: true` are spawned at agent startup. Each enabled
# server's tools are merged into the agent loop as `mcp__<server>__<tool>`.
#
# `command` is optional — when omitted it is derived from runtime+package:
#   python -> [package]            (installed console script)
#   node   -> ["npx", "-y", package]
# Provide `command`/`args`/`env` explicitly for full control.

servers:
  git:
    enabled: false
    runtime: python
    package: "mcp-server-git"
    # command: ["uvx", "mcp-server-git"]
    # args: ["--repository", "."]
    description: "git repository operations"

  github:
    enabled: false
    runtime: node
    package: "@modelcontextprotocol/server-github"
    # command: ["npx", "-y", "@modelcontextprotocol/server-github"]
    # env: { GITHUB_PERSONAL_ACCESS_TOKEN: "ghp_..." }
    description: "GitHub API operations"

  sqlite_mcp:
    enabled: false
    runtime: python
    package: "mcp-server-sqlite"
    # args: ["--db-path", "./data/app.db"]
    description: "SQLite database operations"
