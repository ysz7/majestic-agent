[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "majestic"
version = "0.1.0"
description = "Deploy a fleet of AI agents. Each with its own role, memory, and skills."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",
    "trafilatura>=1.12.0",
    "sqlite-vec>=0.1.1",
    "rich>=13.7.1",
    "click>=8.1.7",
    "aiohttp>=3.9.5",
    "questionary>=2.0.1",
    "textual>=0.60.0",
]

[project.urls]
Homepage = "https://github.com/ysz7/majestic-agent"
Repository = "https://github.com/ysz7/majestic-agent"

[project.scripts]
majestic = "majestic.__main__:main"

[tool.setuptools.packages.find]
exclude = ["tests*", ".venv*"]

[tool.setuptools.package-data]
majestic = ["py.typed"]
